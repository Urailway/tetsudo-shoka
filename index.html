<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【地理狂育】鉄道唱歌チャレンジ</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #10b981;
      --danger: #ef4444;
      --border-color: #e5e7eb;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f172a;
      color: #ffffff;
      padding: 1.25rem 1.5rem;
      text-align: center;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, #0284c7, #10b981);
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lives {
      color: var(--danger);
      letter-spacing: 2px;
    }

    .content-area {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .question-card {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-left: 6px solid var(--primary);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
    }

    .question-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 700;
      color: #0f172a;
    }

    .timer-container {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--primary);
      transition: width 0.1s linear, background-color 0.3s;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      width: 100%;
      padding: 1rem 1.25rem;
      text-align: left;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: #f0f9ff;
      transform: translateY(-1px);
    }

    .option-num {
      background: #e2e8f0;
      color: #475569;
      border-radius: 6px;
      padding: 0.1rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option-btn:hover .option-num {
      background: var(--primary);
      color: #ffffff;
    }

    .option-btn.correct {
      background: #ecfdf5 !important;
      border-color: var(--accent) !important;
      color: #065f46 !important;
    }

    .option-btn.correct .option-num {
      background: var(--accent) !important;
      color: #ffffff !important;
    }

    .option-btn.wrong {
      background: #fef2f2 !important;
      border-color: var(--danger) !important;
      color: #991b1b !important;
    }

    .option-btn.wrong .option-num {
      background: var(--danger) !important;
      color: #ffffff !important;
    }

    .screen-center {
      text-align: center;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .title-icon {
      font-size: 3rem;
      margin-bottom: -0.5rem;
    }

    .btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-main:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-share {
      background: #000000;
      color: white;
      border: none;
      padding: 0.8rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-share:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .score-board {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .score-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .score-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>鉄道唱歌チャレンジ（仮）</h1>
    <p>東海道篇（全66番）</p>
  </header>

  <!-- START SCREEN -->
  <div id="start-screen" class="screen-center">
    <div class="title-icon">🚃</div>
    <h2>全20問の連続クイズ</h2>
    <p style="color: var(--text-sub); font-size: 0.95rem; max-width: 440px; line-height: 1.6;">
      前半の歌詞を見て、正しい後半の歌詞を選んでください。<br>
      素早く答えるほどハイスコア！（3回ミスでゲームオーバー）
    </p>
    <button class="btn-main" onclick="startGame()">START</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="status-bar">
      <div class="status-item">
        <span>問題</span>
        <span id="current-q-num" style="color: var(--primary)">1</span> / 20
      </div>
      <div class="status-item">
        <span>ライフ</span>
        <span id="lives-display" class="lives">♥♥♥</span>
      </div>
      <div class="status-item">
        <span>スコア</span>
        <span id="score-display">0</span>
      </div>
    </div>

    <div class="content-area">
      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div class="question-card">
        <div id="question-tag" class="question-tag">第 1 番</div>
        <div id="question-text" class="question-text">汽笛一声新橋を はや我が汽車は離れたり</div>
      </div>

      <div id="options-container" class="options-list">
        <!-- 5択ボタンが動的に挿入されます -->
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="screen-center hidden">
    <h2 id="result-title">クリア！</h2>
    
    <div class="score-board">
      <div class="score-title">最終スコア</div>
      <div id="final-score" class="score-value">0</div>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">正解数</div>
          <div id="final-correct" class="stat-val">0 / 20</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">合計回答時間</div>
          <div id="final-time" class="stat-val">0.00 秒</div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem;">
      <button id="share-btn" class="btn-share">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        スコアをポストする
      </button>
      <button class="btn-main" onclick="startGame()">リトライ</button>
    </div>
  </div>
</div>

  { num: 60, first: "大阪いでゝ右左 菜種ならざる畑もなし", second: "神崎川のながれのみ 浅黄にゆくぞ美しき" },
  { num: 61, first: "神崎よりのりかへて ゆあみにのぼる有馬山", second: "池田伊丹と名にきゝし 酒の産地もとほるなり" },
  { num: 62, first: "神戸は五港の一つにて あつまる汽船のかず／＼は", second: "亜米利加露西亜支那印度 瀬戸内がよひも交じりたり" },
  { num: 63, first: "磯にはながめ晴れわたる 和田のみさきを控へつつ", second: "山には絶えず布引の 滝見に人もの上りゆく" },
  { num: 64, first: "七度うまれて君が代を まもるといひし楠公の", second: "いしぶみ高き湊川 ながれて世々の人ぞ知る" },
  { num: 65, first: "おもへば夢か時のまに 五十三次のはしりきて", second: "神戸のやどに身をおくも 人に翼の汽車の恩" },
  { num: 66, first: "明けばさらに乗りかへて 山陽道を進ま適", second: "天気は明日も望あり 柳にかすむ月の影" }
];

// ゲーム状態
let currentQuestions = [];
let currentIndex = 0;
let lives = 3;
let score = 0;
let totalTimeMs = 0;
let questionStartTime = 0;
let timerInterval = null;
const QUESTION_LIMIT_MS = 10000; // 1問あたりの制限時間10秒

// Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (type === 'correct') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.setValueAtTime(140, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  }
}

// ゲーム開始処理
function startGame() {
  lives = 3;
  score = 0;
  currentIndex = 0;
  totalTimeMs = 0;

  // 20問をランダム抽出
  const shuffled = [...songData].sort(() => Math.random() - 0.5);
  currentQuestions = shuffled.slice(0, 20);

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  updateLivesDisplay();
  document.getElementById('score-display').textContent = '0';

  loadQuestion();
}

// 問題読み込み
function loadQuestion() {
  if (currentIndex >= currentQuestions.length || lives <= 0) {
    endGame();
    return;
  }

  const q = currentQuestions[currentIndex];
  document.getElementById('current-q-num').textContent = currentIndex + 1;
  document.getElementById('question-tag').textContent = `第 ${q.num} 番`;
  document.getElementById('question-text').textContent = q.first;

  // 選択肢作成 (正解1 + 誤り4)
  const otherItems = songData.filter(item => item.num !== q.num);
  const wrongChoices = [...otherItems].sort(() => Math.random() - 0.5).slice(0, 4);
  const choices = [q, ...wrongChoices].sort(() => Math.random() - 0.5);

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-num">${idx + 1}</span> <span>${choice.second}</span>`;
    btn.onclick = () => handleAnswer(choice.num === q.num, btn);
    container.appendChild(btn);
  });

  // タイマー開始
  startTimer();
}

// タイマー処理
function startTimer() {
  clearInterval(timerInterval);
  questionStartTime = Date.now();
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  bar.style.backgroundColor = 'var(--primary)';

  timerInterval = setInterval(() => {
    const elapsed = Date.now() - questionStartTime;
    const remainingRatio = Math.max(0, (QUESTION_LIMIT_MS - elapsed) / QUESTION_LIMIT_MS);
    
    // 修正箇所：タイマーバーの幅計算の文字欠損を修正
    bar.style.width = `${remainingRatio * 100}%`;
    if (remainingRatio < 0.3) {
      bar.style.backgroundColor = 'var(--danger)';
    }

    if (elapsed >= QUESTION_LIMIT_MS) {
      clearInterval(timerInterval);
      handleAnswer(false, null); // タイムアウトは誤答扱い
    }
  }, 50);
}

// 回答選択時処理
function handleAnswer(isCorrect, clickedBtn) {
  clearInterval(timerInterval);
  const elapsed = Date.now() - questionStartTime;
  totalTimeMs += Math.min(elapsed, QUESTION_LIMIT_MS);

  // ボタン無効化
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(btn => btn.style.pointerEvents = 'none');

  if (isCorrect) {
    playSound('correct');
    if (clickedBtn) clickedBtn.classList.add('correct');

    // スコア計算：基本点1000 + 残り時間ボーナス(最大2000点)
    const timeBonus = Math.max(0, Math.floor((QUESTION_LIMIT_MS - elapsed) * 0.2));
    const gainedScore = 1000 + timeBonus;
    score += gainedScore;
    document.getElementById('score-display').textContent = score.toLocaleString();
  } else {
    playSound('wrong');
    if (clickedBtn) clickedBtn.classList.add('wrong');
    
    // 正解を強調表示
    const q = currentQuestions[currentIndex];
    buttons.forEach(btn => {
      if (btn.textContent.includes(q.second)) {
        btn.classList.add('correct');
      }
    });

    lives--;
    updateLivesDisplay();
  }

  // 次の問へ
  setTimeout(() => {
    if (lives <= 0) {
      endGame();
    } else {
      currentIndex++;
      loadQuestion();
    }
  }, 1200);
}

// ライフ表示更新
function updateLivesDisplay() {
  const hearts = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
  document.getElementById('lives-display').textContent = hearts;
}

// ランク判定
function getRank(finalScore, correctCount) {
  if (correctCount === 20 && finalScore > 45000) return "S+ 級（名誉駅長）";
  if (correctCount === 20) return "S 級（鉄道博士）";
  if (correctCount >= 16) return "A 級（ベテラン旅行家）";
  if (correctCount >= 12) return "B 級（一人旅名人）";
  if (correctCount >= 8)  return "C 級（見習い車掌）";
  return "D 級（途中下車）";
}

// ゲーム終了処理
function endGame() {
  clearInterval(timerInterval);
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  // 正確な正解数を計算
  const correctNum = Math.max(0, (currentIndex + (lives > 0 ? 1 : 0)) - (3 - lives));
  const timeInSec = (totalTimeMs / 1000).toFixed(2);
  const rank = getRank(score, correctNum);

  document.getElementById('result-title').textContent = lives <= 0 ? 'ゲームオーバー' : '全問クリア！';
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('final-correct').textContent = `${correctNum} / 20 問`;
  document.getElementById('final-time').textContent = `${timeInSec} 秒`;

  // --- シェア用の処理 ---
  const shareBtn = document.getElementById('share-btn');
  shareBtn.onclick = function() {
    const shareText = `【地理狂育】鉄道唱歌チャレンジ\nSCORE: ${score.toLocaleString()} (${rank})\n正解数: ${correctNum}/20問\nタイム: ${timeInSec}s\n\n#TetsudoShokaChallenge \n`;
    const shareUrl = `https://example.com`;
    const twitterIntent = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
    
    window.open(twitterIntent, '_blank');
  };
}
